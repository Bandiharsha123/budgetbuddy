<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBuddy Notification</title>
</head>
<body style="margin:0; padding:30px 10px; background-color:#f4f7fb; font-family:Arial,sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0"
                       style="max-width:600px; background:#ffffff; border-radius:12px; overflow:hidden;">

                    <tr>
                        <td style="background:#2563eb; padding:25px; text-align:center;">
                            <h1 style="color:#ffffff; margin:0;">BudgetBuddy</h1>
                            <p style="color:#dbeafe; margin:8px 0 0;">
                                Your personal finance companion
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:35px 30px; color:#334155;">
                            {% block content %}
                            {% endblock %}
                        </td>
                    </tr>

                    <tr>
                        <td style="background:#f8fafc; padding:20px; text-align:center;">
                            <p style="color:#64748b; font-size:12px; margin:0;">
                                You're receiving this email because you use BudgetBuddy.
                            </p>
                            <p style="color:#94a3b8; font-size:12px;">
                                © BudgetBuddy. All rights reserved.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
